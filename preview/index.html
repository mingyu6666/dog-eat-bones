<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小狗吃骨头 - 试玩版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #bfe3f7; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 520px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    pointer-events: none; z-index: 10;
  }
  .score { color: #ffd54f; font-size: 46px; font-weight: 800; text-shadow: 0 3px 10px rgba(0,0,0,0.45); }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .best, .height { color: rgba(255,255,255,0.9); font-size: 15px; text-shadow: 0 2px 6px rgba(0,0,0,0.4); }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(150, 195, 235, 0.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; cursor: pointer;
  }
  .title { color: #fff; font-size: 44px; font-weight: 800; letter-spacing: 4px; margin-bottom: 22px; text-shadow: 0 5px 16px rgba(0,0,0,0.45); }
  .title.over { color: #ff8a80; }
  .subtitle { color: rgba(255,255,255,0.95); font-size: 15px; line-height: 1.8; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .btn {
    margin-top: 34px; padding: 13px 60px;
    background: linear-gradient(135deg, #ffb300, #ff8f00);
    color: #fff; font-size: 20px; font-weight: 700;
    border-radius: 999px; box-shadow: 0 8px 22px rgba(255,143,0,0.45);
  }
  .final-score { color: #ffd54f; font-size: 40px; font-weight: 800; margin-bottom: 14px; text-shadow: 0 3px 10px rgba(0,0,0,0.4); }
  .final-score.height { color: #fff; font-size: 28px; }
  .best-tip { color: rgba(255,255,255,0.85); font-size: 14px; margin-top: 16px; text-shadow: 0 1px 4px rgba(0,0,0,0.35); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud" id="hud" style="display:none">
    <div class="score" id="score">0</div>
    <div class="hud-right">
      <div class="best" id="best">最高 0</div>
      <div class="height" id="height">高度 0m</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="title">小狗吃骨头</div>
    <div class="subtitle">移动小狗瞄准骨头，踩中叼进嘴里继续弹</div>
    <div class="subtitle">碰到狗粮会蹦得特别高！踩空就会摔落</div>
    <div class="btn">点击开始</div>
    <div class="best-tip" id="bestTip"></div>
  </div>

  <div class="overlay" id="overOverlay" style="display:none">
    <div class="title over">游戏结束</div>
    <div class="final-score">得分 <span id="finalScore">0</span></div>
    <div class="final-score height">高度 <span id="finalHeight">0</span>m</div>
    <div class="best-tip" id="overTip"></div>
    <div class="btn">再来一局</div>
  </div>
</div>

<script>
(function () {
  'use strict'
  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  const wrap = document.getElementById('wrap')

  function resize() {
    const dpr = window.devicePixelRatio || 1
    const w = wrap.clientWidth
    const h = wrap.clientHeight
    canvas.width = Math.round(w * dpr)
    canvas.height = Math.round(h * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    game.W = w
    game.H = h
    if (game.state !== 'playing') {
      game.camera = 0
      game.initGame()
      game.updateUI()
    }
  }

  const STORAGE_KEY = 'dog_bone_best'
  const STORAGE_HEIGHT_KEY = 'dog_bone_best_height'
  const PX_PER_M = 40

  const G = 1100
  const JUMP_BOOST = 1.15
  const FOOD_BOOST = 1.85
  const DOG_R = 16
  const FEET_R = 16
  const HIT_ZONE = 20

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)) }
  function rr(ctx, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2)
    ctx.beginPath()
    ctx.moveTo(x + rad, y)
    ctx.lineTo(x + w - rad, y)
    ctx.quadraticCurveTo(x + w, y, x + w, y + rad)
    ctx.lineTo(x + w, y + h - rad)
    ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h)
    ctx.lineTo(x + rad, y + h)
    ctx.quadraticCurveTo(x, y + h, x, y + h - rad)
    ctx.lineTo(x, y + rad)
    ctx.quadraticCurveTo(x, y, x + rad, y)
    ctx.closePath()
  }

  const game = {
    state: 'ready',
    score: 0,
    best: 0,
    height: 0,
    bestHeight: 0,
    W: 390,
    H: 600,
    camera: 0,
    touching: false,
    touchX: 195,
    particles: [],
    foods: [],
    carryBone: null,
    maxHeight: 0,
    elapsed: 0,
    lastFoodClean: 0,
    lastT: 0,
    raf: 0,
    destroyed: false,

    clouds: [
      { x: 60, y: 120, s: 0.9, speed: 8 },
      { x: 280, y: 200, s: 1.2, speed: -6 },
      { x: 180, y: 72, s: 0.7, speed: 10 }
    ],

    loadBest() {
      try {
        this.best = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0
        this.bestHeight = parseInt(localStorage.getItem(STORAGE_HEIGHT_KEY) || '0', 10) || 0
      } catch (e) { this.best = 0; this.bestHeight = 0 }
    },

    saveBest() {
      try {
        localStorage.setItem(STORAGE_KEY, String(this.best))
        localStorage.setItem(STORAGE_HEIGHT_KEY, String(this.bestHeight))
      } catch (e) { /* ignore */ }
    },

    initGame() {
      this.score = 0
      this.state = 'ready'
      this.camera = 0
      this.touching = false
      this.touchX = this.W / 2
      this.particles = []
      this.foods = []
      this.carryBone = null
      this.maxHeight = 0
      this.height = 0
      this.elapsed = 0
      this.lastFoodClean = 0
      this.rabbit = { x: this.W / 2, y: this.H * 0.72 - 55, vx: 0, vy: 0 }
      this.bells = []
      this.spawnStartLayer()
      for (let i = 0; i < 8; i++) this.spawnLayerAbove()
    },

    spawnStartLayer() {
      const startY = this.H * 0.72
      const gap = this.nextGap()
      this.bells.push({ x: this.W / 2, y: startY, r: 40, scored: true, passed: false, hit: false, hitAt: 0, gold: false, gapNext: gap })
      this.lastLayerX = this.W / 2
    },

    spawnLayerAbove() {
      const top = this.bells[0]
      const gap = this.nextGap()
      const r = this.bellRadius()
      const newY = top.y - gap
      top.gapNext = gap
      const scoreNow = this.score
      const count = scoreNow >= 20 && Math.random() < 0.3 ? 2 : 1
      const margin = r + 16
      const maxStep = this.W * 0.4
      const created = []
      const isFirstLayer = this.bells.length === 1
      let x0 = isFirstLayer
        ? clamp(this.W / 2 + (Math.random() * 2 - 1) * 40, margin, this.W - margin)
        : clamp(this.lastLayerX + (Math.random() * 2 - 1) * maxStep, margin, this.W - margin)
      created.push({ x: x0, y: newY, r, scored: false, passed: false, hit: false, hitAt: 0, gold: Math.random() < 0.12, gapNext: 0 })
      if (count === 2) {
        const gapBetween = r * 2.6 + 30
        let x2 = x0 + (Math.random() > 0.5 ? 1 : -1) * gapBetween
        x2 = clamp(x2, margin, this.W - margin)
        if (Math.abs(x2 - x0) < r * 2.2) x2 = clamp(this.W - x0, margin, this.W - margin)
        created.push({ x: x2, y: newY, r, scored: false, passed: false, hit: false, hitAt: 0, gold: Math.random() < 0.12, gapNext: 0 })
      }
      this.lastLayerX = x0
      this.bells.unshift.apply(this.bells, created)
      // 层间随机狗粮
      if (Math.random() < 0.5) {
        this.foods.push({
          x: clamp(Math.random() * this.W, 24, this.W - 24),
          y: (top.y + newY) / 2 + (Math.random() * 2 - 1) * 20,
          r: this.foodRadius(),
          hit: false,
          hitAt: 0
        })
      }
    },

    ensureLayers() {
      let guard = 0
      while (this.bells[0].y - this.camera > 60 && guard < 10) {
        this.spawnLayerAbove()
        guard++
      }
    },

    nextGap() { return Math.min(230, 120 + this.score * 1.8) },
    bellRadius() { return Math.max(20, 44 - this.score * 0.5) },
    foodRadius() { return Math.max(14, 34 - this.score * 0.4) },

    start() {
      const loop = (t) => {
        if (this.destroyed) return
        const dt = this.lastT ? Math.min(0.033, (t - this.lastT) / 1000) : 0.016
        this.lastT = t
        this.elapsed += dt
        this.update(dt)
        this.render(t)
        this.raf = requestAnimationFrame(loop)
      }
      this.raf = requestAnimationFrame(loop)
    },

    update(dt) {
      if (this.state === 'ready' || this.state === 'gameover') {
        this.updateParticles(dt)
        return
      }
      if (this.touching) {
        const prevX = this.rabbit.x
        this.rabbit.x += (this.touchX - this.rabbit.x) * Math.min(1, 20 * dt)
        this.rabbit.vx = (this.rabbit.x - prevX) / Math.max(dt, 0.001)
      } else {
        this.rabbit.vx = 0
      }
      this.rabbit.x = clamp(this.rabbit.x, 24, this.W - 24)
      this.rabbit.vy += G * dt
      this.rabbit.y += this.rabbit.vy * dt

      const feetY = this.rabbit.y + DOG_R * 0.9
      for (const b of this.bells) {
        if (b.scored || b.passed || b.hit) continue
        const d = feetY - b.y
        if (d >= 0 && d <= HIT_ZONE && this.rabbit.vy > 0) {
          if (Math.abs(this.rabbit.x - b.x) <= b.r + FEET_R) {
            this.hitBell(b)
          } else if (d >= HIT_ZONE - 2) {
            b.passed = true
          }
        }
      }

      for (const f of this.foods) {
        if (f.hit) continue
        const ry = this.rabbit.y - this.camera
        const fy = f.y - this.camera
        if (Math.abs(this.rabbit.x - f.x) < f.r + FEET_R + 6 && Math.abs(ry - fy) < f.r + DOG_R) {
          this.hitFood(f)
        }
      }

      const targetCam = this.rabbit.y - this.H * 0.45
      if (targetCam < this.camera) this.camera += (targetCam - this.camera) * 0.18

      const h = Math.max(0, Math.round(-this.camera / PX_PER_M))
      if (h > this.maxHeight) this.maxHeight = h
      if (h !== this.height) { this.height = h; this.updateUI() }

      this.ensureLayers()
      this.cleanupLayers()
      if (this.elapsed - this.lastFoodClean > 2) {
        this.lastFoodClean = this.elapsed
        this.foods = this.foods.filter((f) => !f.hit || this.elapsed - f.hitAt < 1)
      }
      this.updateParticles(dt)

      if (this.rabbit.y - this.camera > this.H + 60) this.gameOver()
    },

    hitBell(b) {
      b.scored = true
      b.hit = true
      b.hitAt = this.elapsed
      this.carryBone = { r: b.r * 0.6, t: this.elapsed }
      this.rabbit.y = b.y - DOG_R * 0.9
      let nearest = null
      for (const o of this.bells) {
        if (o.y < b.y && (!nearest || o.y > nearest.y)) nearest = o
      }
      const gap = nearest ? b.y - nearest.y : b.gapNext || this.nextGap()
      this.rabbit.vy = -Math.sqrt(2 * G * gap) * JUMP_BOOST
      const gain = b.gold ? 5 : 1
      this.addScore(gain)
      this.spawnParticles(b.x, b.y, b.gold ? '#ffd54f' : '#ffb74d', 12)
      playSound('bell')
    },

    hitFood(f) {
      f.hit = true
      f.hitAt = this.elapsed
      let nearest = null
      for (const o of this.bells) {
        if (o.y < f.y && (!nearest || o.y > nearest.y)) nearest = o
      }
      const gap = nearest ? f.y - nearest.y : this.nextGap()
      this.rabbit.vy = -Math.sqrt(2 * G * gap) * JUMP_BOOST * FOOD_BOOST
      this.addScore(5)
      this.spawnParticles(f.x, f.y, '#ffb74d', 16)
      this.spawnParticles(f.x, f.y, '#fff3e0', 8)
      playSound('star')
    },

    addScore(n) {
      this.score += n
      this.updateUI()
    },

    spawnParticles(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2
        const speed = 60 + Math.random() * 140
        this.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 60, life: 0.6 + Math.random() * 0.3, maxLife: 0.9, color })
      }
    },

    updateParticles(dt) {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i]
        p.x += p.vx * dt
        p.y += p.vy * dt
        p.vy += 500 * dt
        p.life -= dt
        if (p.life <= 0) this.particles.splice(i, 1)
      }
    },

    cleanupLayers() {
      if (this.bells.length <= 12) return
      while (this.bells.length > 12 && this.bells[this.bells.length - 1].y - this.camera > this.H + 150 && this.bells[this.bells.length - 1].scored) {
        this.bells.pop()
      }
    },

    gameOver() {
      this.state = 'gameover'
      this.touching = false
      if (this.score > this.best) { this.best = this.score; this.saveBest() }
      if (this.maxHeight > this.bestHeight) { this.bestHeight = this.maxHeight; this.saveBest() }
      this.updateUI()
      playSound('fail')
    },

    startGame() {
      const startBell = this.bells[0]
      this.rabbit.vy = -Math.sqrt(2 * G * (startBell.gapNext || this.nextGap())) * JUMP_BOOST
      this.state = 'playing'
      this.updateUI()
      playSound('bell')
    },

    restart() {
      this.initGame()
      this.updateUI()
    },

    /* ---------- 渲染 ---------- */

    render(t) {
      const W = this.W
      const H = this.H
      ctx.clearRect(0, 0, W, H)
      this.drawBackground(ctx, t)
      this.drawBones(ctx, t)
      this.drawFoods(ctx)
      this.drawDog(ctx)
      this.drawParticles(ctx)
    },

    drawBackground(ctx, t) {
      const W = this.W
      const H = this.H
      const grad = ctx.createLinearGradient(0, 0, 0, H)
      grad.addColorStop(0, '#8ec9f2')
      grad.addColorStop(0.6, '#bfe3f7')
      grad.addColorStop(1, '#e6f5fb')
      ctx.fillStyle = grad
      ctx.fillRect(0, 0, W, H)
      // 公园背景图：cover 全屏铺满（完整场景：蓝天 + 草地 + 步道 + 喷泉）
      if (this.bgLoaded && this.bgImg) {
        const iw = this.bgImg.width
        const ih = this.bgImg.height
        const scale = Math.max(W / iw, H / ih)
        const dw = iw * scale
        const dh = ih * scale
        ctx.drawImage(this.bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh)
      }
    },

    drawClouds(ctx, t) {
      for (const c of this.clouds) {
        c.x += c.speed * 0.016
        if (c.x > this.W + 120) c.x = -120
        if (c.x < -120) c.x = this.W + 120
        ctx.save()
        ctx.globalAlpha = 0.6
        ctx.fillStyle = '#ffffff'
        const s = c.s
        const baseY = c.y + Math.sin(t * 0.0004 + c.x) * 6
        ctx.beginPath()
        ctx.arc(c.x, baseY, 34 * s, 0, Math.PI * 2)
        ctx.arc(c.x - 30 * s, baseY + 6 * s, 24 * s, 0, Math.PI * 2)
        ctx.arc(c.x + 30 * s, baseY + 6 * s, 24 * s, 0, Math.PI * 2)
        ctx.fill()
        ctx.restore()
      }
    },

    drawBones(ctx, t) {
      for (const b of this.bells) {
        const sy = b.y - this.camera
        if (sy < -80 || sy > this.H + 80) continue
        let scale = 1
        let alpha = 1
        if (b.hit) {
          const dt = (this.elapsed - b.hitAt) * 2.2
          scale = 1 + dt
          alpha = Math.max(0, 1 - dt)
          if (dt > 0.9) b.hit = false
        }
        ctx.save()
        ctx.globalAlpha = alpha * (b.scored ? 0.28 : 1)
        ctx.translate(b.x, sy)
        ctx.scale(scale, scale)

        if (b.gold && !b.scored) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 0.006 + b.x)
          ctx.globalAlpha = alpha * (0.25 + 0.25 * pulse)
          ctx.strokeStyle = '#ffd54f'
          ctx.lineWidth = 2
          ctx.beginPath()
          ctx.arc(0, 0, b.r + 6, 0, Math.PI * 2)
          ctx.stroke()
          ctx.globalAlpha = alpha * (b.scored ? 0.28 : 1)
        }

        // 骨头：真实素材精灵（骨头1.png：奶白骨身+暖金环带+爱心黄星装饰）
        if (this.boneLoaded && this.boneImg) {
          const bw = b.r * 2.7
          const bh = (bw * this.boneImg.height) / this.boneImg.width
          ctx.drawImage(this.boneImg, -bw / 2, -bh / 2, bw, bh)
          if (b.gold && !b.scored) {
            const pulse = 0.5 + 0.5 * Math.sin(t * 0.006 + b.x)
            ctx.globalAlpha = alpha * (0.18 + 0.18 * pulse)
            const rg = ctx.createRadialGradient(0, 0, b.r * 0.4, 0, 0, b.r * 1.6)
            rg.addColorStop(0, 'rgba(255,213,79,0.8)')
            rg.addColorStop(1, 'rgba(255,213,79,0)')
            ctx.fillStyle = rg
            ctx.beginPath()
            ctx.arc(0, 0, b.r * 1.6, 0, Math.PI * 2)
            ctx.fill()
            ctx.globalAlpha = alpha * (b.scored ? 0.28 : 1)
          }
        } else {
          // 兜底：程序化绘制（素材加载失败时保证画面不空）
          const boneBody = ctx.createLinearGradient(-b.r * 0.9, 0, b.r * 0.9, 0)
          if (b.gold) {
            boneBody.addColorStop(0, '#ffe082')
            boneBody.addColorStop(0.5, '#ffd54f')
            boneBody.addColorStop(1, '#f0a91e')
          } else {
            boneBody.addColorStop(0, '#ffcf6e')
            boneBody.addColorStop(0.5, '#f6b83d')
            boneBody.addColorStop(1, '#e89b2a')
          }
          ctx.fillStyle = boneBody
          ctx.beginPath()
          const halfLen = b.r * 0.85
          const thick = b.r * 0.34
          ctx.moveTo(-halfLen, -thick)
          ctx.quadraticCurveTo(0, -thick * 1.25, halfLen, -thick)
          ctx.lineTo(halfLen, thick)
          ctx.quadraticCurveTo(0, thick * 1.25, -halfLen, thick)
          ctx.closePath()
          ctx.fill()
          ctx.strokeStyle = '#8a5a2b'
          ctx.lineWidth = 1.6
          ctx.stroke()
          ctx.fillStyle = b.gold ? '#fff8dc' : '#fff6e8'
          ctx.strokeStyle = '#8a5a2b'
          ctx.lineWidth = 1.6
          for (const side of [-1, 1]) {
            ctx.beginPath()
            ctx.arc(side * (halfLen + b.r * 0.12), 0, b.r * 0.42, 0, Math.PI * 2)
            ctx.fill()
            ctx.stroke()
            ctx.fillStyle = 'rgba(255,255,255,0.6)'
            ctx.beginPath()
            ctx.arc(side * (halfLen + b.r * 0.12) - b.r * 0.12, -b.r * 0.14, b.r * 0.12, 0, Math.PI * 2)
            ctx.fill()
            ctx.fillStyle = b.gold ? '#fff8dc' : '#fff6e8'
          }
          ctx.fillStyle = 'rgba(255,255,255,0.45)'
          ctx.beginPath()
          ctx.ellipse(0, -b.r * 0.18, b.r * 0.5, b.r * 0.1, 0, 0, Math.PI * 2)
          ctx.fill()
          ctx.fillStyle = '#ff6b6b'
          ctx.beginPath()
          ctx.moveTo(b.r * 0.45, -b.r * 0.55)
          ctx.bezierCurveTo(
            b.r * 0.3, -b.r * 0.72,
            b.r * 0.02, -b.r * 0.55,
            b.r * 0.45, -b.r * 0.3
          )
          ctx.bezierCurveTo(
            b.r * 0.88, -b.r * 0.55,
            b.r * 0.6, -b.r * 0.72,
            b.r * 0.45, -b.r * 0.55
          )
          ctx.fill()
        }

        ctx.restore()
        ctx.globalAlpha = 1
      }
    },

    drawFoods(ctx) {
      for (const f of this.foods) {
        if (f.hit) {
          const dt = this.elapsed - f.hitAt
          if (dt > 0.6) continue
          ctx.globalAlpha = Math.max(0, 1 - dt * 1.6)
        } else {
          ctx.globalAlpha = 1
        }
        const sy = f.y - this.camera
        if (sy < -60 || sy > this.H + 60) { ctx.globalAlpha = 1; continue }
        const r = f.r
        ctx.save()
        ctx.translate(f.x, sy)
        if (f.hit) {
          const grow = 1 + (this.elapsed - f.hitAt) * 3
          ctx.scale(grow, grow)
        }
        // 狗粮：真实素材精灵（狗粮.png：米白食盆+蓝爪印+橙黄颗粒+黄星）
        if (this.foodLoaded && this.foodImg) {
          const fw = f.r * 2.9
          const fh = (fw * this.foodImg.height) / this.foodImg.width
          ctx.drawImage(this.foodImg, -fw / 2, -fh / 2, fw, fh)
        } else {
          // 兜底：程序化绘制（素材加载失败时保证画面不空）
          ctx.fillStyle = '#fff3e0'
          ctx.strokeStyle = '#8a5a2b'
          ctx.lineWidth = 1.6
          ctx.beginPath()
          ctx.ellipse(0, r * 0.1, r * 0.95, r * 0.62, 0, 0, Math.PI)
          ctx.fill()
          ctx.stroke()
          ctx.strokeStyle = '#8a5a2b'
          ctx.lineWidth = 2
          ctx.beginPath()
          ctx.ellipse(0, r * 0.08, r * 0.95, r * 0.26, 0, 0, Math.PI * 2)
          ctx.stroke()
          ctx.fillStyle = '#5c8fc9'
          ctx.beginPath()
          ctx.ellipse(-r * 0.25, r * 0.32, r * 0.08, r * 0.11, 0, 0, Math.PI * 2)
          ctx.ellipse(r * 0.25, r * 0.32, r * 0.08, r * 0.11, 0, 0, Math.PI * 2)
          ctx.fill()
          ctx.fillStyle = '#ffb74d'
          for (const [gx, gy, gr] of [[-0.45, -0.05, 0.16], [0.1, -0.18, 0.18], [0.42, -0.02, 0.15], [-0.1, 0.18, 0.14], [0.3, 0.18, 0.13]]) {
            rr(ctx, gx * r - gr * r, gy * r - gr * r, gr * r * 2, gr * r * 2, gr * r * 0.4)
            ctx.fill()
          }
          ctx.fillStyle = 'rgba(255,255,255,0.5)'
          for (const [gx, gy, gr] of [[-0.45, -0.05, 0.16], [0.1, -0.18, 0.18]]) {
            rr(ctx, gx * r - gr * r * 0.5, gy * r - gr * r * 0.6, gr * r * 0.8, gr * r * 0.5, gr * r * 0.3)
            ctx.fill()
          }
        }
        if (!f.hit) {
          const pulse = 0.5 + 0.5 * Math.sin(this.elapsed * 5 + f.x)
          ctx.globalAlpha = 0.15 + 0.1 * pulse
          ctx.strokeStyle = '#ffb74d'
          ctx.lineWidth = 1.5
          ctx.beginPath()
          ctx.arc(0, 0, r * 1.25, 0, Math.PI * 2)
          ctx.stroke()
        }
        ctx.restore()
        ctx.globalAlpha = 1
      }
    },

    drawDog(ctx) {
      const r = DOG_R
      const x = this.rabbit.x
      const y = this.rabbit.y - this.camera
      const t = this.elapsed

      if (this.dogLoaded && this.dogImg) {
        const dogH = r * 3.2
        const dogW = (dogH * this.dogImg.width) / this.dogImg.height
        const tilt = clamp(this.rabbit.vx * 0.02, -0.35, 0.35)
        const bob = Math.sin(t * 4) * 2
        const facing = this.rabbit.vx >= 0 ? 1 : -1

        ctx.save()
        ctx.translate(x, y + bob)
        ctx.rotate(tilt)
        ctx.scale(facing, 1)

        ctx.fillStyle = 'rgba(0,0,0,0.12)'
        ctx.beginPath()
        ctx.ellipse(0, dogH * 0.42, dogW * 0.3, dogH * 0.06, 0, 0, Math.PI * 2)
        ctx.fill()

        ctx.drawImage(this.dogImg, -dogW / 2, -dogH * 0.42, dogW, dogH)

        if (this.carryBone) {
          const cr = this.carryBone.r * 1.15
          const cbw = cr * 2.2
          ctx.save()
          ctx.translate(dogW * 0.18, -dogH * 0.12)
          ctx.rotate(0.3)
          if (this.boneLoaded && this.boneImg) {
            const cbh = (cbw * this.boneImg.height) / this.boneImg.width
            ctx.drawImage(this.boneImg, -cbw / 2, -cbh / 2, cbw, cbh)
          } else {
            ctx.fillStyle = '#ffd54f'
            ctx.beginPath()
            ctx.arc(-cr * 0.55, 0, cr * 0.45, 0, Math.PI * 2)
            ctx.arc(cr * 0.55, 0, cr * 0.45, 0, Math.PI * 2)
            ctx.fill()
          }
          ctx.restore()
        }
        ctx.restore()
        return
      }

      // 兜底：程序化简版小狗
      const tilt = clamp(this.rabbit.vx * 0.02, -0.35, 0.35)
      ctx.save()
      ctx.translate(x, y)
      ctx.rotate(tilt)
      ctx.fillStyle = '#f7f2ea'
      ctx.beginPath()
      ctx.ellipse(0, 0, r, r * 1.08, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = '#3b3b3b'
      ctx.beginPath()
      ctx.arc(-r * 0.5, r * 0.18, r * 0.2, 0, Math.PI * 2)
      ctx.arc(r * 0.42, r * 0.5, r * 0.17, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = '#2b2b2b'
      ctx.beginPath()
      ctx.arc(-r * 0.32, -r * 0.18, r * 0.18, 0, Math.PI * 2)
      ctx.arc(r * 0.32, -r * 0.18, r * 0.18, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = '#ff8a80'
      ctx.beginPath()
      ctx.ellipse(r * 0.18, r * 0.35, r * 0.13, r * 0.2, 0.3, 0, Math.PI * 2)
      ctx.fill()
      ctx.restore()
    },

    drawParticles(ctx) {
      for (const p of this.particles) {
        const alpha = Math.max(0, p.life / p.maxLife)
        ctx.globalAlpha = alpha
        ctx.fillStyle = p.color
        ctx.beginPath()
        ctx.arc(p.x, p.y - this.camera, 3 + alpha * 3, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.globalAlpha = 1
    },

    updateUI() {
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const heightEl = document.getElementById('height')
      const hud = document.getElementById('hud')
      const overlay = document.getElementById('overlay')
      const overOverlay = document.getElementById('overOverlay')
      const bestTip = document.getElementById('bestTip')
      const overTip = document.getElementById('overTip')

      hud.style.display = this.state === 'ready' || this.state === 'playing' ? 'flex' : 'none'
      overlay.style.display = this.state === 'ready' ? 'flex' : 'none'
      overOverlay.style.display = this.state === 'gameover' ? 'flex' : 'none'

      if (scoreEl) scoreEl.textContent = this.score
      if (bestEl) bestEl.textContent = '最高 ' + this.best
      if (heightEl) heightEl.textContent = '高度 ' + this.height + 'm'
      if (bestTip) bestTip.textContent = this.best > 0 ? '历史最高 ' + this.best + ' 分 · ' + this.bestHeight + ' 米' : ''
      if (overTip) overTip.textContent = '历史最高 ' + this.best + ' 分 · ' + this.bestHeight + ' 米'
      const fs = document.getElementById('finalScore')
      if (fs) fs.textContent = this.score
      const fh = document.getElementById('finalHeight')
      if (fh) fh.textContent = this.height
    }
  }

  /* ---------- 音频（WebAudio 合成） ---------- */
  let audioCtx = null
  function ensureAudio() {
    if (audioCtx) return
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)() } catch (e) { /* ignore */ }
  }
  function playTone(freq, dur, type, gain) {
    if (!audioCtx) return
    try {
      const o = audioCtx.createOscillator()
      const g = audioCtx.createGain()
      o.type = type || 'sine'
      o.frequency.value = freq
      g.gain.setValueAtTime(gain || 0.12, audioCtx.currentTime)
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur)
      o.connect(g)
      g.connect(audioCtx.destination)
      o.start()
      o.stop(audioCtx.currentTime + dur)
    } catch (e) { /* ignore */ }
  }
  function playSound(name) {
    if (name === 'bell') { playTone(880, 0.09, 'triangle', 0.14); setTimeout(() => playTone(1320, 0.08, 'triangle', 0.1), 60) }
    else if (name === 'star') { playTone(520, 0.12, 'sawtooth', 0.08); setTimeout(() => playTone(780, 0.1, 'sawtooth', 0.08), 70); setTimeout(() => playTone(1040, 0.14, 'sawtooth', 0.08), 140) }
    else if (name === 'fail') { playTone(300, 0.4, 'sawtooth', 0.1); setTimeout(() => playTone(180, 0.5, 'sawtooth', 0.1), 120) }
  }

  /* ---------- 输入（桌面悬停即跟随；手机触摸） ---------- */
  function handleDown(x) {
    ensureAudio()
    if (game.state === 'ready') {
      game.touchX = x
      game.startGame()
    }
    if (game.state === 'playing') {
      game.touching = true
      game.touchX = x
    }
  }
  function handleMove(x) {
    if (game.state === 'playing') {
      game.touching = true
      game.touchX = x
    }
  }
  function handleUp() {
    game.touching = false
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault()
    const t = e.touches[0]
    if (t) handleDown(t.clientX)
  }, { passive: false })
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault()
    const t = e.touches[0]
    if (t) handleMove(t.clientX)
  }, { passive: false })
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault()
    handleUp()
  }, { passive: false })
  canvas.addEventListener('mousedown', (e) => handleDown(e.clientX))
  canvas.addEventListener('mousemove', (e) => handleMove(e.clientX))
  canvas.addEventListener('mouseleave', () => handleUp())
  window.addEventListener('mouseup', () => handleUp())

  document.getElementById('overlay').addEventListener('click', () => {
    if (game.state === 'ready') game.startGame()
  })
  document.getElementById('overOverlay').addEventListener('click', () => {
    if (game.state === 'gameover') game.restart()
  })

  /* ---------- 素材加载（真实精灵图） ---------- */
  game.bgLoaded = false
  game.bgImg = new Image()
  game.bgImg.onload = () => { game.bgLoaded = true }
  game.bgImg.src = 'bg.jpg'
  game.boneLoaded = false
  game.boneImg = new Image()
  game.boneImg.onload = () => { game.boneLoaded = true }
  game.boneImg.src = 'bone.png'
  game.foodLoaded = false
  game.foodImg = new Image()
  game.foodImg.onload = () => { game.foodLoaded = true }
  game.foodImg.src = 'food.png'
  game.dogLoaded = false
  game.dogImg = new Image()
  game.dogImg.onload = () => { game.dogLoaded = true }
  game.dogImg.src = 'dog.png'

  /* ---------- 启动 ---------- */
  game.loadBest()
  window.addEventListener('resize', resize)
  resize()
  game.initGame()
  game.updateUI()
  window.__game = game
  if (/[?&]auto=1/.test(location.search)) {
    game.touchX = game.W / 2
    game.startGame()
  }
  game.start()
})();
</script>
